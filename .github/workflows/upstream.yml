name: Upstream check

# The counterpart to ci.yml. That workflow pins everything so a failure means
# the commit is broken; this one pins nothing so a failure means the world
# moved. Deliberately not attached to pushes or pull requests: it must never
# be able to fail somebody's unrelated change.
#
# What it catches, roughly in order of likelihood:
#   - a GStreamer release that breaks the build or the install scripts
#   - a packaging change like the 1.28 move from MSI to a single installer
#   - a Rust release whose new clippy lints fire on existing code
#   - GitHub moving ubuntu-latest to the next LTS
on:
  schedule:
    # Mondays, 06:00 UTC. Weekly is enough: nothing here is urgent, and a
    # failure is a heads-up rather than something blocking work.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Nothing here writes to the repository - this workflow builds, lints and
# tests. Declared explicitly rather than left to the repository default,
# which is currently read but is a setting rather than a promise: a change
# made in the web interface years from now should not quietly widen what
# every pull request's token can do.
permissions:
  contents: read

jobs:
  linux:
    name: Linux (current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          chmod +x setup-linux.sh
          ./setup-linux.sh

      # No --locked: this is also where a dependency that no longer resolves
      # should show up, rather than being frozen out by the lockfile.
      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --release -- -D warnings

  windows:
    name: Windows (current)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        shell: pwsh
        run: .\setup-windows.ps1

      - name: Carry the script's environment into the job
        shell: pwsh
        run: |
          $pkgConfig = [Environment]::GetEnvironmentVariable('PKG_CONFIG_PATH', 'User')
          if (-not $pkgConfig) { throw 'setup-windows.ps1 did not set PKG_CONFIG_PATH' }
          Write-Host "setup-windows.ps1 chose $pkgConfig"
          $root = Split-Path (Split-Path $pkgConfig -Parent) -Parent
          "PKG_CONFIG_PATH=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Records what the current versions actually are, so a failure here can
      # be read against the pins in ci.yml without digging.
      - name: Versions in play
        shell: pwsh
        run: |
          pkg-config --modversion gtk4 gstreamer-1.0 glib-2.0
          rustc --version

      - name: Build
        run: cargo build --release

  # Whether anything in the dependency tree has had a security advisory
  # published against it since the last time anybody looked.
  #
  # **Here rather than in ci.yml, and that is the whole point of the split.**
  # An advisory appears against a crate we shipped months ago, with no commit
  # involved - so gating pull requests on it would fail somebody's unrelated
  # change for something they did not do, which is exactly what this workflow
  # exists to avoid. A failure here means the world moved, and the answer is a
  # dependency bump rather than a fix to whatever was being worked on.
  #
  # The licence and duplicate checks are the opposite kind of question and run
  # on every pull request in ci.yml instead: those are deterministic, so a red
  # there really does mean the commit added something.
  #
  # Ignores live in `deny.toml` with a date and a reason, not as a flag here.
  # An advisory with no fix available would otherwise leave this permanently
  # red, and a gate people learn to ignore is not a gate.
  advisories:
    name: Security advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The same action ci.yml uses, so there is one tool and one config
      # rather than `cargo-audit` here and `cargo-deny` there disagreeing
      # about what counts. Only the advisories check runs.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          # No --locked: this workflow pins nothing on purpose, and an
          # advisory against a version the lockfile has already moved past is
          # not worth waking anybody for.
          arguments: --all-features
