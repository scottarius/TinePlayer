name: Release

# Builds the downloadable packages and attaches them to a GitHub release.
#
# Triggered by pushing a tag that starts with "v", so the tag is what decides
# a release happens rather than a branch or a button. Also available from the
# Actions tab for a dry run, which builds everything and uploads it as job
# artifacts without creating a release at all.
#
# Rehearsing this is expected: tags and releases can be deleted, including on
# a private repository, and the same version number can be used again
# afterwards. Better to find a broken packaging script on v0.6.0-test1 than on
# the day of the real one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the packages but do not create a release"
        type: boolean
        default: true

# Pinned for the same reason CI pins: a release should be reproducible from
# its tag, not dependent on what upstream published that morning.
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"
  GSTREAMER_VERSION: "1.28.5"

# Read by default, and write only where it is actually used - which is the
# `release` job below and nothing else. The three build jobs handle the
# signing secrets and run the packaging scripts, and none of them has any
# business being able to write to the repository while doing it.
permissions:
  contents: read

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pin Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Install dependencies
        shell: pwsh
        run: .\setup-windows.ps1 -GStreamerVersion $env:GSTREAMER_VERSION

      # setup-windows.ps1 writes User-scope variables, which a later step does
      # not inherit. Same handling as ci.yml, and derived from what the script
      # decided rather than recomputed.
      - name: Carry the script's environment into the job
        shell: pwsh
        run: |
          $pkgConfig = [Environment]::GetEnvironmentVariable('PKG_CONFIG_PATH', 'User')
          if (-not $pkgConfig) { throw 'setup-windows.ps1 did not set PKG_CONFIG_PATH' }
          $root = Split-Path (Split-Path $pkgConfig -Parent) -Parent
          "PKG_CONFIG_PATH=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Builds the executable, chooses the plugins, walks the libraries,
      # collects the licenses, and produces both the ZIP and the installer.
      # Inno Setup is installed by the script if the runner lacks it.
      - name: Package
        shell: pwsh
        run: .\packaging\windows\package.ps1 -GStreamer $env:GSTREAMER_ROOT

      # A package that cannot start is worse than no package. This runs it
      # with GStreamer's own directory off PATH, which is the whole point of
      # bundling: if a library was missed, this is where it shows.
      - name: Check it runs without GStreamer on PATH
        shell: pwsh
        run: |
          $stage = Get-ChildItem dist\windows -Directory | Select-Object -First 1
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          # Start-Process -Wait rather than the call operator: TinePlayer is a
          # GUI-subsystem binary, so PowerShell does not wait for it and
          # $LASTEXITCODE would be whatever came before.
          $run = Start-Process -FilePath "$($stage.FullName)\TinePlayer.exe" `
              -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) {
              throw "the packaged build could not start: exit $($run.ExitCode)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/windows/*.zip
            dist/windows/*-setup.exe

  macos:
    name: macOS package (${{ matrix.arch }})
    # Whether there is a certificate to sign with. Carried into an env var
    # because the secrets context cannot be read from a step's `if`, only from
    # `env` and `with` - and a workflow that tries is rejected outright, with
    # no jobs and no log to say why.
    env:
      SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    strategy:
      # One architecture failing should not cancel the other, matching Linux.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    # Both are macOS 15, so each gets the same Homebrew formula versions and
    # the GTK build below matches the same release on either.
    #
    # macos-15-intel is retired in fall 2027, and macos-26-intel succeeds it.
    # Both entries move together when that upgrade comes, rather than one at a
    # time: two packages built on different OS versions would differ in more
    # than their architecture.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Pin Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      # The runner ships with aws/tap preinstalled, and Homebrew now refuses
      # to use an untrusted tap - printing a screen of explanation on every
      # brew call to say so. Nothing here comes from that tap, so it is noise
      # rather than a failure, but a wall of warning text is what a real
      # message hides behind, and the GTK build below is one whose output has
      # to be readable. Untapped rather than HOMEBREW_NO_REQUIRE_TAP_TRUST,
      # which is broader and switches off a check Homebrew is making mandatory.
      - name: Quiet the untrusted tap warning
        run: brew untap aws/tap || true

      - name: Install dependencies
        run: |
          chmod +x setup-mac.sh
          ./setup-mac.sh

      # --- A GTK a screen reader can see into ---------------------------
      #
      # Homebrew's gtk4 is compiled without the AccessKit backend, so a bundle
      # built against it is silent to VoiceOver however carefully the widgets
      # are named. packaging/macos/verify.sh refuses to ship one, so this is
      # not optional decoration: without these steps the job fails rather than
      # producing an inaccessible package.
      #
      # Keyed on the GTK version Homebrew has, because that is what
      # gtk-accesskit.sh builds to match - ours links against Homebrew's glib
      # and pango and the bundle takes its schemas from the gtk4 formula, so
      # the two have to stay in step. A Homebrew gtk4 bump therefore misses
      # the cache and rebuilds, which is the point.
      - name: Which GTK to match
        id: gtk
        run: |
          version="$(brew list --versions gtk4 | awk '{print $2}')"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Homebrew has GTK $version"

      - name: Cache the AccessKit GTK
        id: gtk-cache
        uses: actions/cache@v4
        with:
          path: ~/gtk-a11y
          key: gtk-accesskit-${{ runner.os }}-${{ runner.arch }}-${{ steps.gtk.outputs.version }}-${{ hashFiles('packaging/macos/gtk-accesskit.sh') }}

      - name: Build GTK with AccessKit
        if: steps.gtk-cache.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja
          chmod +x packaging/macos/gtk-accesskit.sh
          ./packaging/macos/gtk-accesskit.sh

      # Signing and notarization, when the secrets for them exist.
      #
      # Without them the build still works and produces an ad-hoc signed
      # bundle - which opens on the machine that built it, and on anyone
      # else's Mac produces a warning that has to be clicked past in System
      # Settings, or worse, claims the app is damaged. That is the state this
      # is here to end, and it costs an Apple developer membership.
      #
      # Nothing needs editing here when that arrives: add the secrets and the
      # next release is signed.
      - name: Set up signing
        if: env.SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          # A keychain of its own, made for this job. The runner is destroyed
          # afterwards, but a certificate that came out of a secret still does
          # not belong in the login keychain, and a separate one means the
          # partition list can be set without touching anything else.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          echo "$CERT_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign stops to ask for permission to use the key,
          # and a runner has nobody to ask: the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain" >/dev/null

          # Put it in the search list so codesign and notarytool find it.
          security list-keychain -d user -s "$keychain" login.keychain-db

          # notarytool credentials, stored in the same keychain. Done with an
          # App Store Connect key rather than an Apple ID and app-specific
          # password: no second factor, and it can be revoked on its own.
          echo "$API_KEY_P8" | base64 --decode >"$RUNNER_TEMP/api.p8"
          xcrun notarytool store-credentials tineplayer \
            --key "$RUNNER_TEMP/api.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --keychain "$keychain"
          rm -f "$RUNNER_TEMP/api.p8"

      # Builds the bundle, fills it with libraries and licenses, takes the
      # LGPL FFmpeg from GStreamer's own macOS build, and makes the disk
      # image. Signing stays ad-hoc unless TINE_SIGN_IDENTITY is set, so these
      # are empty and harmless until the secrets exist.
      #
      # The three GTK variables are what point the build at the AccessKit GTK
      # rather than Homebrew's. All three are needed: PKG_CONFIG_PATH decides
      # which headers are compiled against, RUSTFLAGS decides which library is
      # actually linked - they can disagree, and when they do the build
      # succeeds and the result is silently inaccessible - and
      # TINEPLAYER_GTK_PREFIX is what lets the packaging copy it in and
      # collect its license paperwork.
      - name: Package
        env:
          TINE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TINE_NOTARY_PROFILE: ${{ secrets.MACOS_CERT_P12 != '' && 'tineplayer' || '' }}
          TINE_NOTARY_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
        run: |
          # $HOME/gtk-a11y, which is where gtk-accesskit.sh installed it and
          # where the cache restores it. The install names inside those dylibs
          # are absolute, so the path has to be the one they were built at.
          export TINEPLAYER_GTK_PREFIX="$HOME/gtk-a11y"
          export PKG_CONFIG_PATH="$TINEPLAYER_GTK_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export RUSTFLAGS="-L native=$TINEPLAYER_GTK_PREFIX/lib -C link-arg=-Wl,-search_paths_first"
          chmod +x packaging/macos/*.sh
          ./packaging/macos/package.sh

      - name: Check it runs from the bundle
        run: |
          dist/macos/TinePlayer.app/Contents/MacOS/tineplayer --version

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/macos/*.dmg

  linux:
    name: Linux package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for both. Emulation is not needed for a .deb - it
          # is a compile and a file copy - but it is 10 times slower, and an
          # arm64 runner costs nothing on a public repository.
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Built in the same container a developer builds in, rather than on the
      # runner directly, so that CI and a local build cannot drift apart. It
      # also decides compatibility: a .deb records the versions of what it was
      # linked against, so the build has to happen on the oldest system the
      # package should install on. That is Debian 12, which is what Raspberry
      # Pi OS is built from. Building on the runner's own Ubuntu would set
      # that floor by whatever GitHub happened to update to.
      #
      # No --platform: each runner already is the architecture it builds for.
      - name: Build the package
        run: |
          docker build -f packaging/linux/Dockerfile -t tine-deb .
          docker run --rm -v "$PWD:/src" -w /src tine-deb \
            bash ./packaging/linux/package.sh

      # Installing it is the only thing that proves the dependencies were
      # declared correctly, since apt refuses a package whose dependencies
      # cannot be met. Done in a clean Debian 12 with no GStreamer on it,
      # rather than on the runner, which has had a build environment installed
      # and would not notice a missing runtime dependency.
      - name: Check it installs and runs on a clean system
        run: |
          docker run --rm -v "$PWD/dist/linux:/pkg:ro" debian:12 bash -c '
            apt-get update -qq
            apt-get install -y -qq /pkg/*.deb
            tineplayer --version
          '

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/linux/*.deb

  release:
    permissions:
      contents: write # creating the release and uploading to it
    name: Publish
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    # Only for a tag. A manual run builds and uploads artifacts, which is what
    # makes a rehearsal possible without leaving a release behind.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # The full history, so the previous tag can be found. A shallow
      # checkout is a single commit, with nothing to compare against.
      #
      # `persist-credentials: false` because this is the one job whose token
      # can write to the repository, and `actions/checkout` otherwise leaves
      # it in `.git/config` for every later step to find. Nothing here needs
      # it: the history is read locally and the release is created by the
      # action below, which is handed a token directly. The other checkouts
      # in this file and in ci.yml do not set it, because `contents: read`
      # above already means their token can do nothing worth stealing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Read off the artifacts rather than spelled out below, so the notes
      # cannot name a download that does not exist. Writing the names by hand
      # and substituting a version number looks like it works and does not:
      # the first test release said TinePlayer-0.6.0-setup.exe for a file
      # called TinePlayer-0.6.0-windows-x64-setup.exe, and TinePlayer-0.6.0.dmg
      # for TinePlayer-0.6.0-macos.dmg. Both would have sent people hunting.
      #
      # Deliberately not tolerant of surprises: if a package is missing or a
      # naming convention changes, this fails here rather than producing
      # confident and wrong instructions.
      # The link GitHub's generated notes end with, without the list of commit
      # subjects that comes above it. That list is a poor substitute for a
      # sentence about what the release was for, but the comparison itself is
      # worth having: it answers "what actually changed" for anyone who wants
      # the detail.
      - name: Work out what changed
        id: changelog
        run: |
          set -euo pipefail
          repo="${{ github.server_url }}/${{ github.repository }}"
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            echo "link=$repo/compare/$previous...$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
          else
            # A first release has nothing to compare against.
            echo "link=$repo/commits/$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
          fi

      - name: Name the downloads
        id: files
        run: |
          set -euo pipefail

          # Returns rather than exits, and is called from an assignment: an
          # exit inside a command substitution only ends the subshell, so
          # `echo "x=$(only ...)"` would carry on and write an empty value.
          # An assignment carries the failure, and set -e stops the step.
          only() {
            local found
            found="$(ls $1 2>/dev/null || true)"
            if [ -z "$found" ]; then
              echo "No file matching $1" >&2
              return 1
            fi
            if [ "$(echo "$found" | wc -l)" -ne 1 ]; then
              echo "Expected one file matching $1, found:" >&2
              echo "$found" >&2
              return 1
            fi
            basename "$found"
          }

          setup="$(only 'artifacts/windows/*setup.exe')"
          zip="$(only 'artifacts/windows/*.zip')"
          mac_arm="$(only 'artifacts/macos-arm64/*.dmg')"
          mac_intel="$(only 'artifacts/macos-x86_64/*.dmg')"
          amd64="$(only 'artifacts/linux-amd64/*.deb')"
          arm64="$(only 'artifacts/linux-arm64/*.deb')"

          {
            echo "setup=$setup"
            echo "zip=$zip"
            echo "mac_arm=$mac_arm"
            echo "mac_intel=$mac_intel"
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >>"$GITHUB_OUTPUT"

      - name: Publish the release
        # Pinned to a commit for the same reason `rust-cache` is in ci.yml: a
        # moving tag is someone else's code changing under a build that is
        # trusted to be reproducible. It matters more here than there - this
        # is the workflow holding the signing certificate, the notarization
        # key and `contents: write` - and it was the one that did not have it.
        # v3.0.2.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            artifacts/windows/*
            artifacts/macos-arm64/*
            artifacts/macos-x86_64/*
            artifacts/linux-amd64/*
            artifacts/linux-arm64/*
          # Left as a draft so the notes can be finished, and the packages
          # tried, before anyone can download them. Publishing is a button.
          draft: true
          # The notes start filled in, so that writing them is editing rather
          # than starting from an empty box on the day. Everything that does
          # not change between releases - which file to download, how to
          # install, what Windows will say about it - is already here and
          # correct. What is left is saying what changed.
          #
          # Not generate_release_notes: a list of commit subjects is a poor
          # substitute for a sentence about what the release was for, and it
          # lands underneath all of this rather than in the section meant for
          # it.
          body: |
            ## What's new

            New release!

            ## If you are upgrading

            - What to do.

            ## Which files to download

            | Platform | Download | Notes |
            | --- | --- | --- |
            | Windows | `${{ steps.files.outputs.setup }}` | The usual install, with a Start menu entry |
            | | `${{ steps.files.outputs.zip }}` | No installation, runs from wherever you unpack it |
            | Mac | `${{ steps.files.outputs.mac_arm }}` | Apple silicon: any M1 or newer Mac |
            | | `${{ steps.files.outputs.mac_intel }}` | Intel: Macs sold before late 2020 |
            | Linux | `${{ steps.files.outputs.amd64 }}` | Most desktops and laptops, Intel or AMD |
            | | `${{ steps.files.outputs.arm64 }}` | Raspberry Pi 4 or 5, and other ARM single-board computers |

            ## Installing

            ### Windows

            Download and run the installer, or download and extract the .zip file.

            Windows may warn you that it does not recognize the publisher, because the download is not signed with a certificate. Click **More info**, then **Run anyway**.

            ### Mac

            Download and open the .dmg file and drag TinePlayer.app into your Applications folder.

            If you are not sure which of the two you need, open the Apple menu and choose **About This Mac**. A line reading **Chip** means Apple silicon; one reading **Processor** means Intel.

            ### Linux

            Download the .deb file for your architecture and install it with apt:

            ```sh
            sudo apt install ./${{ steps.files.outputs.arm64 }}
            ```

            The leading `./` matters: without it apt looks for a package by that name in its own sources and reports that it cannot find one. Using apt rather than `dpkg -i` is what pulls in the GTK and GStreamer pieces TinePlayer needs.

            Then run `tineplayer`, or find TinePlayer in your applications menu.

            If unsure which package to download, run:

            ```sh
            dpkg --print-architecture
            ```

            ## Known issues

            - :(

            ## Feedback

            [Issues](https://github.com/scottarius/TinePlayer/issues) for bugs, [Discussions](https://github.com/scottarius/TinePlayer/discussions) for everything else. I especially want to hear from you if you use a screen reader or rely on audio description: support for both is thin, and I would rather fix it against what people actually need than guess.

            **Full Changelog**: ${{ steps.changelog.outputs.link }}
