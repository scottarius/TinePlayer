name: Release

# Builds the downloadable packages and attaches them to a GitHub release.
#
# Triggered by pushing a tag that starts with "v", so the tag is what decides
# a release happens rather than a branch or a button. Also available from the
# Actions tab for a dry run, which builds everything and uploads it as job
# artifacts without creating a release at all.
#
# Rehearsing this is expected: tags and releases can be deleted, including on
# a private repository, and the same version number can be used again
# afterwards. Better to find a broken packaging script on v0.6.0-test1 than on
# the day of the real one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the packages but do not create a release"
        type: boolean
        default: true

# Pinned for the same reason CI pins: a release should be reproducible from
# its tag, not dependent on what upstream published that morning.
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"
  GSTREAMER_VERSION: "1.28.5"

permissions:
  contents: write # creating the release and uploading to it

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pin Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Install dependencies
        shell: pwsh
        run: .\setup-windows.ps1 -GStreamerVersion $env:GSTREAMER_VERSION

      # setup-windows.ps1 writes User-scope variables, which a later step does
      # not inherit. Same handling as ci.yml, and derived from what the script
      # decided rather than recomputed.
      - name: Carry the script's environment into the job
        shell: pwsh
        run: |
          $pkgConfig = [Environment]::GetEnvironmentVariable('PKG_CONFIG_PATH', 'User')
          if (-not $pkgConfig) { throw 'setup-windows.ps1 did not set PKG_CONFIG_PATH' }
          $root = Split-Path (Split-Path $pkgConfig -Parent) -Parent
          "PKG_CONFIG_PATH=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Builds the executable, chooses the plugins, walks the libraries,
      # collects the licenses, and produces both the ZIP and the installer.
      # Inno Setup is installed by the script if the runner lacks it.
      - name: Package
        shell: pwsh
        run: .\packaging\windows\package.ps1 -GStreamer $env:GSTREAMER_ROOT

      # A package that cannot start is worse than no package. This runs it
      # with GStreamer's own directory off PATH, which is the whole point of
      # bundling: if a library was missed, this is where it shows.
      - name: Check it runs without GStreamer on PATH
        shell: pwsh
        run: |
          $stage = Get-ChildItem dist\windows -Directory | Select-Object -First 1
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          # Start-Process -Wait rather than the call operator: TinePlayer is a
          # GUI-subsystem binary, so PowerShell does not wait for it and
          # $LASTEXITCODE would be whatever came before.
          $run = Start-Process -FilePath "$($stage.FullName)\TinePlayer.exe" `
              -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) {
              throw "the packaged build could not start: exit $($run.ExitCode)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/*.zip
            dist/windows/*-setup.exe

  macos:
    name: macOS package
    # Apple Silicon only, which is a deliberate decision: Apple stopped
    # selling Intel Macs in 2023 and macOS 26 is their last release. An Intel
    # package would be this same job on an Intel runner, added if anyone asks.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Pin Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Install dependencies
        run: |
          chmod +x setup-mac.sh
          ./setup-mac.sh

      # Builds the bundle, fills it with libraries and licenses, takes the
      # LGPL FFmpeg from GStreamer's own macOS build, and makes the disk
      # image. Signing stays ad-hoc unless TINE_SIGN_IDENTITY is set.
      - name: Package
        run: |
          chmod +x packaging/macos/*.sh
          ./packaging/macos/package.sh

      - name: Check it runs from the bundle
        run: |
          dist/macos/TinePlayer.app/Contents/MacOS/TinePlayer --version

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/macos/*.dmg

  linux:
    name: Linux package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for both. Emulation is not needed for a .deb - it
          # is a compile and a file copy - but it is 10 times slower, and an
          # arm64 runner costs nothing on a public repository.
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Built in the same container a developer builds in, rather than on the
      # runner directly, so that CI and a local build cannot drift apart. It
      # also decides compatibility: a .deb records the versions of what it was
      # linked against, so the build has to happen on the oldest system the
      # package should install on. That is Debian 12, which is what Raspberry
      # Pi OS is built from. Building on the runner's own Ubuntu would set
      # that floor by whatever GitHub happened to update to.
      #
      # No --platform: each runner already is the architecture it builds for.
      - name: Build the package
        run: |
          docker build -f packaging/linux/Dockerfile -t tine-deb .
          docker run --rm -v "$PWD:/src" -w /src tine-deb \
            bash ./packaging/linux/package.sh

      # Installing it is the only thing that proves the dependencies were
      # declared correctly, since apt refuses a package whose dependencies
      # cannot be met. Done in a clean Debian 12 with no GStreamer on it,
      # rather than on the runner, which has had a build environment installed
      # and would not notice a missing runtime dependency.
      - name: Check it installs and runs on a clean system
        run: |
          docker run --rm -v "$PWD/dist/linux:/pkg:ro" debian:12 bash -c '
            apt-get update -qq
            apt-get install -y -qq /pkg/*.deb
            tineplayer --version
          '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/linux/*.deb

  release:
    name: Publish
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    # Only for a tag. A manual run builds and uploads artifacts, which is what
    # makes a rehearsal possible without leaving a release behind.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Taken from Cargo.toml rather than from the tag, because it is what the
      # packaging scripts name the files after. A tag that disagrees with
      # Cargo.toml would otherwise produce notes pointing at downloads that do
      # not exist, which is exactly the case a test tag creates.
      - name: Work out the version the files are named for
        id: version
        run: |
          echo "number=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" \
            >>"$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*
            artifacts/macos/*
            artifacts/linux-amd64/*
            artifacts/linux-arm64/*
          # Left as a draft so the notes can be finished, and the packages
          # tried, before anyone can download them. Publishing is a button.
          draft: true
          # The notes start filled in, so that writing them is editing rather
          # than starting from an empty box on the day. Everything that does
          # not change between releases - which file to download, what the
          # unsigned-binary warnings look like, how to install - is already
          # here and correct. What is left is saying what changed.
          #
          # Not generate_release_notes: a list of commit subjects is a poor
          # substitute for a sentence about what the release was for, and it
          # lands underneath all of this rather than in the section meant for
          # it.
          body: |
            ## What's new

            <!-- A sentence or two on what this release was about, so the
                 bullets have something to hang off. Say plainly if it is a
                 grab bag; pretending to a theme reads worse than not having
                 one. Then bullets, grouped by what a person would notice
                 rather than by what was edited. -->

            -
            -

            <!-- OPTIONAL. Only things that actually break: a setting that
                 moved, a file that has to be re-created, a platform that has
                 stopped working. Delete the heading if empty. -->

            ## If you are upgrading

            -

            ## Which files to download

            | Platform | Download | Notes |
            | --- | --- | --- |
            | Windows | `TinePlayer-${{ steps.version.outputs.number }}-setup.exe` | The usual way, with a Start menu entry |
            | | `TinePlayer-${{ steps.version.outputs.number }}-windows-x64.zip` | No installation, runs from wherever you unpack it |
            | Mac | `TinePlayer-${{ steps.version.outputs.number }}.dmg` | Any M1 or newer Mac |
            | Linux | `tineplayer_${{ steps.version.outputs.number }}_amd64.deb` | Most desktops and laptops, Intel or AMD |
            | | `tineplayer_${{ steps.version.outputs.number }}_arm64.deb` | Raspberry Pi 4 or 5, and other ARM single-board computers |

            ## Installing

            ### Windows

            Download and run the installer, or download and extract the .zip
            file.

            Windows may warn you that it does not recognize the publisher,
            because the download is not signed with a certificate. Click
            **More info**, then **Run anyway**.

            ### Mac

            Download and open the .dmg file and drag TinePlayer.app into your
            Applications folder.

            macOS may refuse to open it the first time, because the app is not
            signed with an Apple developer certificate. Open **System
            Settings**, go to **Privacy & Security**, scroll to the bottom,
            and click **Open Anyway** next to the message about TinePlayer.
            You only have to do this once.

            If instead it tells you the app is damaged, macOS has quarantined
            it. Clear that with:

            ```sh
            xattr -dr com.apple.quarantine /Applications/TinePlayer.app
            ```

            ### Linux

            Download the .deb file for your architecture and install it with
            apt:

            ```sh
            sudo apt install ./tineplayer_${{ steps.version.outputs.number }}_arm64.deb
            ```

            The leading `./` matters: without it apt looks for a package by
            that name in its own sources and reports that it cannot find one.
            Using apt rather than `dpkg -i` is what pulls in the GTK and
            GStreamer pieces TinePlayer needs.

            Then run `tineplayer`, or find TinePlayer in your applications
            menu.

            If unsure which package to download, run:

            ```sh
            dpkg --print-architecture
            ```

            <!-- OPTIONAL, but be honest here. Someone who hits a known
                 problem and finds it listed is annoyed; someone who hits one
                 that is not listed wonders what else is wrong. Delete the
                 heading if empty. -->

            ## Known issues

            -

            ## Feedback

            [Issues](https://github.com/scottarius/TinePlayer/issues) for
            bugs, [Discussions](https://github.com/scottarius/TinePlayer/discussions)
            for everything else. I especially want to hear from you if you use
            a screen reader or rely on audio description: support for both is
            thin, and I would rather fix it against what people actually need
            than guess.
