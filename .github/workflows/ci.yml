name: CI

# Pushes and pull requests to main, plus a manual trigger from the Actions
# tab for when you want to re-run without pushing anything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately runs the same script the README tells people to run, so
      # CI fails if that script is wrong. The runner already has Rust, which
      # the script detects and skips.
      - name: Install dependencies
        run: |
          chmod +x install.sh
          ./install.sh

      # Restores ~/.cargo and target/ between runs. Without it every build
      # recompiles the GTK and GStreamer bindings from scratch, which is the
      # slowest part by far. The key includes the lockfile so a dependency
      # change correctly invalidates it.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # install.ps1 uses winget, which is unreliable in the non-interactive
      # session a runner executes in, so GStreamer is fetched directly here
      # instead. This means CI does NOT exercise install.ps1's own logic; that
      # script still has to be verified by hand on a real machine.
      #
      # Pinned so a bad upstream release can't turn into a mystery CI failure.
      # As of 1.28 this is a single Inno Setup installer rather than the older
      # pair of runtime/devel MSIs, and its default component set includes the
      # development files. The step after this one proves that.
      - name: Install GStreamer
        shell: pwsh
        run: |
          $version = '1.28.5'
          $pkg = "gstreamer-1.0-msvc-x86_64-$version.exe"
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc/$pkg"
          Write-Host "Downloading $pkg"
          Invoke-WebRequest -Uri $url -OutFile $pkg
          # Inno Setup silent flags. /SP- suppresses the "this will install..."
          # prompt that /VERYSILENT alone still shows.
          $p = Start-Process ".\$pkg" -Wait -PassThru -ArgumentList @(
            '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          )
          if ($p.ExitCode -ne 0) { throw "Installer exited $($p.ExitCode)" }

      # The installer is per-user, landing in the same place install.ps1
      # expects, but the location is verified rather than assumed so a layout
      # change upstream fails here with a clear message instead of producing a
      # cryptic linker error later.
      - name: Configure environment
        shell: pwsh
        run: |
          $root = "$env:LOCALAPPDATA\Programs\gstreamer\1.0\msvc_x86_64"
          if (-not (Test-Path "$root\lib\pkgconfig\gstreamer-1.0.pc")) {
            throw "GStreamer not found at $root after install"
          }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Verify GTK 4 comes from GStreamer
        shell: pwsh
        run: |
          # The project depends on GStreamer's Windows distribution supplying
          # GTK 4 as well. If that ever stops being true, the build failure
          # further down would be cryptic, so it's checked explicitly.
          pkg-config --modversion gtk4 gstreamer-1.0 glib-2.0

      - name: Build
        run: cargo build --release --locked
