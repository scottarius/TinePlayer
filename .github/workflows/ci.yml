name: CI

# Pushes and pull requests to main, plus a manual trigger from the Actions
# tab for when you want to re-run without pushing anything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately runs the same script the README tells people to run, so
      # CI fails if that script is wrong. The runner already has Rust, which
      # the script detects and skips.
      - name: Install dependencies
        run: |
          chmod +x install.sh
          ./install.sh

      # Restores ~/.cargo and target/ between runs. Without it every build
      # recompiles the GTK and GStreamer bindings from scratch, which is the
      # slowest part by far. The key includes the lockfile so a dependency
      # change correctly invalidates it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # install.ps1 uses winget, which isn't dependably present on hosted
      # runners, so GStreamer is fetched directly here instead. This means CI
      # does NOT exercise install.ps1's own logic; that script still has to be
      # verified by hand on a real machine.
      - name: Install GStreamer
        shell: pwsh
        run: |
          $version = '1.28.5'
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          foreach ($pkg in @("gstreamer-1.0-msvc-x86_64-$version.msi",
                             "gstreamer-1.0-devel-msvc-x86_64-$version.msi")) {
            Write-Host "Downloading $pkg"
            Invoke-WebRequest -Uri "$base/$pkg" -OutFile $pkg
            Start-Process msiexec.exe -Wait -ArgumentList @(
              '/i', $pkg, '/quiet', '/qn', '/norestart', 'INSTALLLEVEL=1000'
            )
          }

      # The MSI installs to Program Files rather than the per-user location
      # install.ps1 expects, so the paths are resolved rather than assumed.
      - name: Configure environment
        shell: pwsh
        run: |
          $root = "C:\gstreamer\1.0\msvc_x86_64"
          if (-not (Test-Path "$root\lib\pkgconfig\gstreamer-1.0.pc")) {
            throw "GStreamer not found at $root after install"
          }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Verify GTK 4 comes from GStreamer
        shell: pwsh
        run: |
          # The project depends on GStreamer's Windows distribution supplying
          # GTK 4 as well. If that ever stops being true, the build failure
          # further down would be cryptic, so it's checked explicitly.
          pkg-config --modversion gtk4 gstreamer-1.0 glib-2.0

      - name: Build
        run: cargo build --release --locked
