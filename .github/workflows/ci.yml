name: CI

# Pushes and pull requests to main, plus a manual trigger from the Actions
# tab for when you want to re-run without pushing anything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Everything version-like is pinned here on purpose. This workflow gates
# merges, so a red build has to mean "this commit is broken" and nothing else.
# Whether the project still works against current upstream is a different
# question, asked on a schedule by upstream.yml instead.
env:
  CARGO_TERM_COLOR: always
  # Floating the toolchain would let a new Rust release fail an unrelated
  # commit, and with `clippy -D warnings` that is not hypothetical: each
  # release adds lints that fire on code which was clean the day before.
  RUST_VERSION: "1.97.1"
  GSTREAMER_VERSION: "1.28.5"

jobs:
  linux:
    # Both architectures, because arm64 is a shipped target: the Pi runs the
    # arm64 .deb. Without this it is only ever compiled when a tag is pushed,
    # so a dependency that fails on aarch64 surfaces in the middle of a
    # release rather than on the commit that caused it. Native runners, which
    # cost nothing on a public repository.
    #
    # This proves it builds and lints. It cannot prove it runs: there is no
    # display and no audio device here, and the Pi-specific faults worth
    # fearing are all runtime ones.
    strategy:
      # One architecture failing should not cancel the other. Knowing whether
      # a break is arch-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    # Pinned rather than ubuntu-latest, which silently moves to the next LTS
    # and changes every apt package version underneath setup-linux.sh.
    runs-on: ${{ matrix.runner }}
    name: Linux ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      # Set before setup-linux.sh runs, which detects an existing Rust and skips
      # installing one. rustup is already on the runner, so this needs no
      # third-party action.
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      # Deliberately runs the same script the README tells people to run, so
      # CI fails if that script is wrong. The runner already has Rust, which
      # the script detects and skips.
      - name: Install dependencies
        run: |
          chmod +x setup-linux.sh
          ./setup-linux.sh

      # Restores ~/.cargo and target/ between runs. Without it every build
      # recompiles the GTK and GStreamer bindings from scratch, which is the
      # slowest part by far. The key includes the lockfile so a dependency
      # change correctly invalidates it.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-${{ matrix.arch }}-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      # Formatting is the one check that cannot differ by platform, so it is
      # run here and nowhere else. Everything below is repeated per platform
      # because it genuinely can differ: a `cfg` block is only compiled, and
      # only linted, on the platform it is written for.
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      # A `tr!` added without regenerating the template is a string no
      # translator is ever shown - it works perfectly in English and is missing
      # from every other language, which is precisely the failure nobody
      # notices. The extractor writes no timestamp, so a clean `git diff` here
      # means the template really is current.
      #
      # Only on amd64: it reads the source and has no architecture to be
      # sensitive to, and running it twice would just be twice the log.
      - name: Translation template is up to date
        if: matrix.arch == 'amd64'
        run: |
          python3 packaging/extract-strings.py
          git diff --exit-code po/tineplayer.pot \
            || { echo "::error::po/tineplayer.pot is out of date. Run: python3 packaging/extract-strings.py"; exit 1; }

      # The bundled fonts are cut down to only the characters TinePlayer can
      # draw, and building them is a manual step needing the network. So a
      # translation can be added or extended without the fonts following, and
      # the symptom is a screen of boxes in a language nobody here reads.
      #
      # This reads only what is already in the tree - the catalogs and the
      # built fonts - so it needs no network and catches the gap on the commit
      # that opens it. It is how the whole problem was found: the non-Latin
      # fonts shipped with three to twelve characters each, enough for the
      # language menu and nothing else.
      - name: Bundled fonts cover the translations
        if: matrix.arch == 'amd64'
        run: |
          python3 -m pip install --quiet fonttools
          python3 packaging/fonts/build-fonts.py --check

  # The packaging and setup scripts, which nothing else here exercises: they
  # only run during a release, so a fault in one surfaces in the middle of
  # cutting it. Two did on 2026-08-12, and shellcheck catches the kind that
  # was - a variable left referenced after its assignment moved elsewhere,
  # which `set -u` turns into a failure twelve minutes into a macOS job.
  #
  # Preinstalled on the Ubuntu runner, so this costs seconds and needs no
  # action. -x follows `source`, without which the shared helpers read as
  # undefined. Warning and above: the style and info levels are opinions about
  # scripts that work, and a gate people learn to ignore is not a gate.
  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: |
          shellcheck --version
          # Every tracked .sh, so a new script is covered by existing rather
          # than by remembering to add it to a list here.
          mapfile -t scripts < <(git ls-files '*.sh')
          printf '%s\n' "${scripts[@]}"
          shellcheck -x -S warning "${scripts[@]}"

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pin Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy,rustfmt
          rustup default $env:RUST_VERSION

      # Runs the same script the README tells people to run, so CI fails if
      # that script is wrong - matching how the Linux job treats setup-linux.sh.
      #
      # The version is named explicitly because winget always serves the
      # current release. There is no equivalent on the Linux side: apt on a
      # released Ubuntu serves a frozen GStreamer, so pinning the runner image
      # pins the dependency too.
      - name: Install dependencies
        shell: pwsh
        run: .\setup-windows.ps1 -GStreamerVersion $env:GSTREAMER_VERSION

      # setup-windows.ps1 sets User-scope environment variables, which a later step
      # in the same job does not inherit, so its conclusions are copied into
      # Actions' own mechanism. Deliberately derived from what the script
      # wrote rather than recomputed here, so a wrong answer from the script
      # fails the build instead of being silently corrected.
      - name: Carry the script's environment into the job
        shell: pwsh
        run: |
          $pkgConfig = [Environment]::GetEnvironmentVariable('PKG_CONFIG_PATH', 'User')
          if (-not $pkgConfig) { throw 'setup-windows.ps1 did not set PKG_CONFIG_PATH' }
          Write-Host "setup-windows.ps1 chose $pkgConfig"
          $root = Split-Path (Split-Path $pkgConfig -Parent) -Parent
          "PKG_CONFIG_PATH=$pkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Verify GTK 4 comes from GStreamer
        shell: pwsh
        run: |
          # The project depends on GStreamer's Windows distribution supplying
          # GTK 4 as well. If that ever stops being true, the build failure
          # further down would be cryptic, so it's checked explicitly.
          pkg-config --modversion gtk4 gstreamer-1.0 glib-2.0

      - name: Build
        run: cargo build --release --locked

      # The two `#[cfg(target_os = "windows")]` drive-letter tests in
      # `browser.rs` exist only here, so until this step was added on
      # 2026-08-20 they were the only tests in the project that nothing
      # automated ever ran - tests were a macOS-only step, where those two are
      # compiled out. That is also why the count is two higher on Windows.
      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release -- -D warnings

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      # One architecture failing should not cancel the other, as on Linux:
      # knowing whether a break is arch-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    # Pinned like the others. Both are macOS 15, so Homebrew serves the same
    # formula versions to each and a difference between them is a real
    # architecture difference rather than an OS one.
    #
    # Unlike the other two platforms, the dependency versions cannot be pinned
    # to match: Homebrew always serves current, with no equivalent of winget's
    # version argument or apt's frozen archive. A GStreamer release can
    # therefore break this job without any commit doing so - the one place in
    # this workflow where red does not strictly mean "this commit is broken".
    #
    # macos-15-intel is retired in fall 2027, and macos-26-intel succeeds it,
    # so Intel support does not end with it. Both entries move together when
    # that upgrade comes: keeping the two on one OS version is what makes a
    # difference between them an architecture difference rather than an OS one.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Pin Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      # The runner ships with aws/tap preinstalled, and Homebrew now refuses
      # to use an untrusted tap - printing a screen of explanation on every
      # brew call to say so. Nothing here comes from that tap, so it is noise
      # rather than a failure, but a wall of warning text is what a real
      # message hides behind. Untapped rather than HOMEBREW_NO_REQUIRE_TAP_TRUST,
      # which is broader and switches off a check Homebrew is making mandatory.
      - name: Quiet the untrusted tap warning
        run: brew untap aws/tap || true

      # The same script the README tells people to run, matching how the other
      # two jobs treat theirs. Homebrew is preinstalled on the runner, so the
      # script skips installing it: this covers the dependency install and the
      # build, not the bootstrap a new machine goes through. That path is
      # tested on a clean VM instead, since a runner cannot reach it.
      - name: Install dependencies
        run: |
          chmod +x setup-mac.sh
          ./setup-mac.sh

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed on the architecture as well: target/ holds compiled objects
          # for one of them, and a cache shared between the two would restore
          # the wrong ones.
          key: macos-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-${{ matrix.arch }}-cargo-

      - name: Verify GTK 4 and GStreamer share one prefix
        run: |
          # Two prefixes would mean two copies of glib, which is the conflict
          # that breaks the Windows build when GTK is installed outside
          # GStreamer. macOS invites it from the other direction, because
          # GStreamer's own package ships no GTK at all - so both must come
          # from Homebrew, and this fails loudly if they ever stop doing.
          # Both must come from Homebrew. Compared against its prefix rather
          # than against each other: Homebrew reports a per-formula Cellar
          # path, so gtk4 and gstreamer never share one even when correctly
          # installed side by side.
          brew_prefix="$(brew --prefix)"
          for package in gtk4 gstreamer-1.0 glib-2.0; do
            prefix="$(pkg-config --variable=prefix "$package")"
            echo "$package: $prefix ($(pkg-config --modversion "$package"))"
            case "$prefix" in
              "$brew_prefix"*) ;;
              *)
                echo "::error::$package comes from $prefix, outside Homebrew - which means a second copy of glib"
                exit 1
                ;;
            esac
          done

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release -- -D warnings

