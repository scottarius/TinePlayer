name: Seed the GStreamer cache

# Downloads GStreamer once, slowly, where nothing is waiting on it, and leaves
# it in the cache for `ci.yml` to restore.
#
# WHY THIS EXISTS
#     The Windows job installs GStreamer through winget, which fetches an
#     840 MB installer from gstreamer.freedesktop.org - outside GitHub's
#     network and outside its cache. On 2026-08-23 that server was serving it
#     at about 120 KB/s: eight minutes for the first megabyte, 213 MB in half
#     an hour. At that rate the download alone is a two-hour job, and winget
#     has no download timeout, so before `ci.yml` grew one the job simply hung
#     until somebody noticed.
#
#     `ci.yml` restores this cache and skips the download entirely on a hit.
#     But a cache has to be written before it can be read, and the only thing
#     that could write it was the very job that could not finish. This breaks
#     that circle: it is allowed to take hours because no pull request is
#     blocked while it does.
#
# WHY IT RUNS ON MAIN
#     A cache written by a run is scoped to that run's branch. Only the
#     default branch's caches are readable from every other branch, so seeding
#     from a pull request would produce a cache that only that pull request
#     could use. `workflow_dispatch` from `main` is what makes it available to
#     all of them.
#
# WHEN TO RUN IT
#     After bumping GSTREAMER_VERSION, and any time the Windows job starts
#     downloading again - which means the cache expired, GitHub having evicted
#     it after seven days without a read.

on:
  workflow_dispatch:

env:
  # Must match ci.yml. Kept as a literal rather than read from there, since a
  # workflow cannot import another's env - so bumping the version means
  # editing both, and the verify step below is what catches forgetting.
  GSTREAMER_VERSION: "1.28.5"

# Deliberately no `timeout-minutes`, unlike every job in `ci.yml`. This is the
# one place a slow download is the point rather than a fault, so it takes
# GitHub's six-hour default.
jobs:
  seed:
    name: Download and cache GStreamer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The same key and path `ci.yml` reads. They have to stay in step: a
      # mismatch here is invisible, and shows up only as the Windows job
      # quietly downloading again.
      - id: cache
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\Programs\gstreamer
          key: windows-gstreamer-${{ env.GSTREAMER_VERSION }}

      - name: Report what the cache had
        shell: pwsh
        run: |
          if ('${{ steps.cache.outputs.cache-hit }}' -eq 'true') {
            Write-Host 'Already seeded for this version. Nothing to download.'
          } else {
            Write-Host 'No cache for this version yet; downloading.'
          }

      # Skipped on a hit, so re-running this by hand is cheap and safe.
      - name: Install GStreamer
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\setup-windows.ps1 -GStreamerVersion $env:GSTREAMER_VERSION

      # Proves the tree is the one `ci.yml` needs before it is cached, rather
      # than finding out in a pull request. `Resolve-GstRoot` looks for exactly
      # these files, and a half-written install that satisfied the path but not
      # the contents would be worse than no cache at all.
      - name: Verify before caching
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $root = "$env:LOCALAPPDATA\Programs\gstreamer\1.0\msvc_x86_64"
          foreach ($pc in 'gstreamer-1.0', 'gtk4', 'glib-2.0') {
            $path = "$root\lib\pkgconfig\$pc.pc"
            if (-not (Test-Path $path)) { throw "$pc.pc missing at $path" }
            Write-Host "  ok $pc.pc"
          }
          $size = (Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("cached tree: {0:N1} GB" -f ($size / 1GB))
