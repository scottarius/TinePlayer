# TinePlayer settings, fully commented.
#
# Copy this to the per-user config directory and edit it, or just use the
# settings menu, which writes the same file:
#
#   Linux:    ~/.config/tineplayer/config.yaml
#   Windows:  %LOCALAPPDATA%\TinePlayer\config.yaml
#
# Every setting is optional. Leave one out and its default applies; there is no
# need to list settings you are not changing.


# --- Appearance -------------------------------------------------------------

# Multiplies every font size and spacing in the interface, from 0.33 to 3.
#
# Leave it out and the size follows the display while the window is fullscreen,
# which is what suits a television: a 4K screen the desktop is not already
# scaling would otherwise draw a ten-foot interface at desk-monitor size.
# Windowed, it stays at 1, since the same screen across a desk is read from
# arm's length.
#
# Set it and that size applies either way.
ui_scale: 1.5

# What language TinePlayer's own menus are in, as a locale code: de, fr, pt-BR.
#
# Leave it out to follow whatever this machine is set to, which is right for
# almost everybody - and is why it is left out of the file when unset, so a
# config carried between two machines does not pin one to the other's language.
# Set it where the machine's language is not the one the viewer wants, which
# happens often enough on a shared television to be worth a setting.
#
# `en` means English specifically rather than "no preference". A language
# TinePlayer has no translation for falls back to English.
#
# Which languages a build has is listed under Settings > General > Interface
# Language. See docs/translating.md to add one.
language: ru

# A short click when moving through the menus, played through the primary
# output. true or false.
sounds: true


# --- Audio outputs ----------------------------------------------------------
#
# Device names are the ones the settings menu lists. They differ by platform:
# "Built-in Audio Analogue Stereo" on Linux, "Speakers (Realtek High Definition
# Audio)" on Windows. Copy them from the menu rather than guessing.

# Where the first audio track goes. Left unset, the first run picks the
# system default output and writes it here.
primary_sink: Built-in Audio Analogue Stereo

# Where the second goes. Leave it out, or set it to null, to play through the
# primary output alone.
secondary_sink: Sennheiser USB Headset Analogue Stereo


# --- Language preferences ---------------------------------------------------
#
# Used to choose tracks automatically for a video that has not been played
# before. Once you have chosen tracks for a video by hand, those are what it
# comes back to.
#
# Two-letter codes; the full list is in docs/configuration.md. Only the leading
# letters are compared, so "en" matches a track tagged eng or en-US, and a
# subtitle file named film.en.hi.srt.

# Falls back to the first audio track when unset.
primary_language: en

# Falls back to the second audio track when unset.
secondary_language: ru

# --- Audio description -------------------------------------------------------
#
# An audio description track narrates what is happening on screen, for a viewer
# who is blind or has low vision. Set per output, so one person can hear the
# description while everyone else hears the ordinary soundtrack, and so two
# people who both need it can have it in different languages.
#
# Only applies to a video you have not played before. A described track is
# never chosen unless asked for here, and never in a language other than the
# one preferred above - description you cannot follow is worse than none. A
# track that does not say what language it is still counts, because a good deal
# of description carries no language tag.

primary_audio_description: false
secondary_audio_description: false

# --- Volume ------------------------------------------------------------------
#
# Each output has its own level, because two of them are rarely matched: a pair
# of headphones and a television are not the same loudness at the same setting,
# and one person should be able to turn theirs down without touching the other.
#
# Set from the volume button during playback, and kept from one film to the
# next, so these normally look after themselves. Levels run from 0.0 to 1.0.

primary_volume: 1.0
secondary_volume: 1.0
primary_muted: false
secondary_muted: false

# --- Audio sync --------------------------------------------------------------
#
# Bluetooth headphones or other speaker setups may add noticeable delay, and not
# all systems compensate for it. Or perhaps the audio track is just not in sync
# with the video to begin with. This setting nudges the audio forward or
# backwards to line it up by ear.
#
# In milliseconds, from -1000 to 1000. A positive value holds that output back,
# for sound arriving before the picture. A negative one moves it earlier, for
# sound arriving after it.
#
# Each output is corrected separately, so wireless headphones can be lined up
# without touching what's playing on speakers. Easiest to adjust live during
# playback from the volume button, where the change is heard as it is made.

primary_offset_ms: 0
secondary_offset_ms: 0

# Whether each delay is applied. Off keeps the value and stops using it, which
# is how you check whether a delay is helping without losing the figure you
# found by ear.
#
# Missing means off, since nobody starts out needing a delay - so a delay set
# here by hand does nothing until the matching switch below is true as well.

primary_offset_on: false
secondary_offset_on: false

# How a subtitle is chosen for a video you have not picked one for. Either one
# of the automatic modes, or a language code to always prefer that language:
#
#   none              nothing
#   primary_forced    forced subtitles, preferring the primary output's language
#   primary           full subtitles in the primary output's language
#   secondary_forced  forced subtitles, preferring the secondary output's language
#   secondary         full subtitles in the secondary output's language
#
# The forced modes fall back to the other output's language; the full modes
# do not.
#
# Defaults to primary_forced. A choice made for a video always wins over this.
subtitle_language: primary_forced


# --- Subtitles --------------------------------------------------------------

# Point size against the video's own resolution rather than the screen's, so
# one number holds on any display.
subtitle_size: 12

# Font family and style, without a size. The generic families - Sans, Serif,
# Monospace - resolve on any system whatever is installed. A family that is not
# installed is quietly substituted rather than reported.
subtitle_font: Sans Bold


# --- Resuming ------------------------------------------------------------

# Whether where a video got to, and the tracks chosen for it, are written down
# at all. Off stops every write to positions.json and leaves whatever is
# already in it alone - the two settings below then decide nothing, and the
# settings menu greys them out to say so. Clearing what is already saved is
# under Settings > General > Data, and works either way.
remember_positions: true

# How far into a video you have to be for stopping to count as a place to
# resume from, as a percentage of its running time. Below this it is treated as
# a false start. Never less than ten seconds, however short the video.
resume_min_percent: 5

# Past this percentage a video counts as watched: its position is forgotten
# rather than saved, so it starts from the beginning next time instead of
# dropping you back into the ending.
watched_percent: 90


# --- Written automatically --------------------------------------------------
#
# TinePlayer adds these itself so it reopens where you left off. They are listed
# here only so they are not a surprise when you open a real config file; there
# is no need to set them by hand.
#
#   last_video:   the video that was open last
#   last_folder:  where the built-in browser last was
#   fullscreen:   whether it was fullscreen, remembered between runs
