[package]
name = "tineplayer"
# Development versions carry `-dev` so a build from main never claims to be
# the release it follows - "About TinePlayer v1.1.0-dev" says at a glance that
# a bug report is not from a released build. Dropped when a release is cut,
# then set to the next `-dev` immediately after.
#
# The update check parses the three leading numbers and ignores the rest, so a
# dev build is never told to downgrade to the release behind it. Windows
# packaging trims the suffix for the one field Inno insists is numeric.
version = "1.2.0-dev"
edition = "2024"

# The crate keeps its lowercase name for crates.io conventions, while the
# executable is capitalized to match how the application presents itself.
[[bin]]
# Lowercase, because Linux is the only one of the three platforms with a
# case-sensitive filesystem and so the only one where two spellings of the
# name can disagree. The Debian package has always installed `tineplayer`, and
# a source build now matches it. Windows packaging renames the executable to
# `TinePlayer.exe`, which is the name people see there; macOS keeps this name
# inside `TinePlayer.app`, where nothing looks at it.
name = "tineplayer"
path = "src/main.rs"

# These versions look old on purpose: they set a deliberate portability
# baseline of GTK 4.6 and GStreamer 1.18, so the project builds on the
# distributions people actually run rather than only on current ones.
#
#   Ubuntu 22.04 LTS (supported to 2027) ... GTK 4.6
#   Debian 12 / Raspberry Pi OS Bookworm ... GTK 4.8
#   Ubuntu 24.04 LTS ....................... GTK 4.14
#   Debian 13 Trixie ....................... GTK 4.18
#
# Building against the oldest of those still runs on all the newer ones:
# GTK 4.x and GStreamer 1.x are both API/ABI stable within their major
# version, and the version *features* on these crates only gate whether we
# may call newer APIs - they don't restrict what runtime we work against.
# (Already demonstrated: these bindings target GStreamer 1.18 and run fine
# against 1.22 and 1.28.)
#
# Taking the newest crates instead would raise the floor to GTK 4.10 and
# drop both Bookworm and Ubuntu 22.04 LTS, which between them cover most
# Raspberry Pi installs. Concretely, gst-plugin-gtk4 0.15 uses
# `gtk::Accessible`, which gtk4-rs 0.11 gates behind `v4_10`, so it cannot
# build against anything older even with default features off.
#
# 0.13.7 is the last gst-plugin-gtk4 release declaring `default = []`, i.e.
# the last one that explicitly supports building with no GTK version
# features at all; 0.14+ default to `gtk_v4_10`. It targets gtk4 0.9 and
# gstreamer 0.23, so the rest of the GStreamer stack is pinned to 0.23 to
# match - mixing 0.23 and 0.25 in one dependency graph would produce two
# incompatible sets of GStreamer types that can't be passed between the
# plugin and our own pipeline code.
#
# Known cost of this baseline: the `dmabuf` zero-copy path needs GTK 4.14,
# so newer systems don't get it (the GL path below is used instead, which
# handles 1080p fine). gst-plugin-gtk4 0.13.7 also warns on GTK >= 4.13
# that alpha-channel frames may render incorrectly - irrelevant for opaque
# video, but worth remembering if transparent overlays are ever composited
# into the video frames themselves.

[dependencies]
# Cross-correlating two loudness envelopes, to line a separate audio file up
# with the video. MIT/Apache, pure Rust, no transitive weight worth naming.
# The technique is ordinary signal processing rather than anyone's invention:
# see src/align.rs, which is written from the method and not from any GPL
# implementation of it.
rustfft = "6"

# wrap_help so help text is wrapped to the real terminal width, with
# continuation lines indented under their option. Without it clap assumes 100
# columns and a narrower console breaks each description mid-sentence against
# the left margin.
clap = { version = "4.6.4", features = ["derive", "wrap_help"] }
gilrs = "0.11"
glib = "0.20"
gstreamer = "0.23"
gstreamer-pbutils = "0.23"
# Pulling decoded samples back into Rust, for the alignment in src/align.rs.
# Same 0.23 family as the rest of the GStreamer stack, for the reasons above.
gstreamer-app = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# One HTTPS GET, for the version check. Deliberately the smallest thing that
# does that: a full HTTP client would be more code than the feature. rustls
# rather than the system TLS because it needs no OpenSSL headers to build,
# which keeps setup-linux.sh and the .deb dependencies exactly as they are.
# "-probe" reads the machine's own certificate store instead of baking a copy
# in, so an expired bundle is the operating system's problem rather than ours.
minreq = { version = "2.14", features = ["https-rustls-probe", "json-using-serde"] }
serde_yaml = "0.9.34"
gtk = { package = "gtk4", version = "0.9" }

# Statically linked into this binary rather than installed as a shared
# GStreamer plugin - gtk4paintablesink isn't packaged for Debian or shipped
# with the GStreamer Windows installer, so depending on it as a normal crate
# avoids making users build and install a plugin separately per platform.
# Platform GL features are added per-target below; without them the sink
# falls back to CPU-side frame handling, which can't keep up with 1080p on
# a Pi (observed: "a lot of buffers are being dropped").
gst-plugin-gtk4 = "0.13.7"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Both backends are built in so a single binary works whether the session
# is Wayland or X11; the sink picks the right one at runtime.
gst-plugin-gtk4 = { version = "0.13.7", features = ["wayland", "x11egl", "x11glx"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
# Compiles the icon into the executable's resources. Build-time only, and
# Windows-only: there is no counterpart to embed on Linux.
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
# AttachConsole, so a GUI-subsystem release build can still write to the
# terminal it was started from, and the window subclass that receives the
# media keys - which Windows sends as WM_APPCOMMAND rather than as keys.
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
# SystemMediaTransportControls: the panel behind the volume button in the task
# bar, with transport buttons and artwork. WinRT rather than Win32, so it needs
# this crate rather than windows-sys - already compiled here as a dependency of
# gilrs, so this is features rather than another tree.
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    # ISystemMediaTransportControlsInterop, which is how a plain Win32 window
    # gets hold of controls that were designed for a packaged application.
    "Win32_System_WinRT",
    "Win32_Foundation",
] }
# AsyncStatus, for waiting on the one asynchronous call in the panel code.
# The `windows` crate re-exports windows-core but not this, so it is named.
windows-future = "0.3"
# No GL feature here: the `winegl` feature needs gstreamer-gl-egl, and the
# official GStreamer Windows build ships gstreamer-gl without any EGL
# variant, so enabling it fails at link time with unresolved
# gst_gl_display_egl_* symbols. The sink falls back to CPU-side frame
# handling, which desktop GPUs handle comfortably.
gst-plugin-gtk4 = "0.13.7"

[target.'cfg(target_os = "macos")'.dependencies]
# The media keys, which macOS never delivers as key events: it routes them to
# whichever application it believes is playing, which is why they drive
# whatever else is open while TinePlayer is in front. MPRemoteCommandCenter is
# the sanctioned way to be that application, and it covers the buttons on
# AirPods and a headset as well as the keys on a keyboard.
#
# MPNowPlayingInfoCenter comes with it rather than as an extra: what is
# published there is how macOS decides who is playing, so without it the
# commands are never routed here at all. It also puts the film in Control
# Center and on the lock screen, with its title and how far in it is.
#
# Every crate in this tree is MIT, Apache-2.0 or Zlib, checked 2026-08-13 over
# the whole transitive set rather than the two named here - objc2-media-player
# pulls in app-kit, av-foundation and core-foundation behind it. Nothing is
# copyleft, which the packaging depends on.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSValue", "NSData"] }
objc2-media-player = { version = "0.3", features = [
    "MPRemoteCommandCenter",
    "MPRemoteCommand",
    "MPRemoteCommandEvent",
    "MPNowPlayingInfoCenter",
    "MPMediaItem",
    "block2",
    # MPMediaItemArtwork hands back an NSImage, so the poster needs AppKit and
    # the CGSize the request handler is asked for.
    "objc2-app-kit",
    "objc2-core-foundation",
] }
# NSImage, for the poster in the now-playing widget. Already in the tree
# behind objc2-media-player; named here because this uses it directly.
objc2-app-kit = { version = "0.3", features = ["NSImage"] }
# CGSize, which the artwork request handler is asked for and answers with.
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
block2 = "0.6"
